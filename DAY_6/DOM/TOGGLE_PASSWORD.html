<!doctype html>
<html>
  <body>
    <input type="password" id="pwd" />

    <button onclick="toggle()">Show/Hide</button>

    <script>
      function toggle() {
        let pwd = document.getElementById("pwd");

        if (pwd.type === "password") pwd.type = "text";
        else pwd.type = "password";
      }
    </script>
  </body>
</html>
