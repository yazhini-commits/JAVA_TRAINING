<!doctype html>
<html>
  <body>
    <textarea id="text"></textarea>

    <p>Characters: <span id="count">0</span></p>

    <script>
      let text = document.getElementById("text");

      text.addEventListener("input", function () {
        document.getElementById("count").innerHTML = text.value.length;
      });
    </script>
  </body>
</html>
